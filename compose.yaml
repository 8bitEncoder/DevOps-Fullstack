version: '3.8'
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: mydb
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "5020:5020"
    environment:
      # THE MAGIC: "db" here is the hostname. Compose automatically creates a network
      # so the app container can talk to the db container using its service name.
      - DATABASE_URL=postgres://myuser:mysecretpassword@db:5432/mydb
    depends_on:
      - db

volumes:
  pgdata:
